<div class="flex min-h-screen flex-col items-center justify-center bg-navy px-4">
    <div class="w-full max-w-sm">
      <div class="mb-10 text-center">
        <div class="mb-6 inline-flex items-center gap-2">
          <div class="flex h-8 w-8 items-center justify-center rounded bg-teal"><span class="font-display text-sm font-bold text-navy">AC</span></div>
          <span class="font-display text-lg font-semibold tracking-tight text-fore">Portfolio Admin</span>
        </div>
        <h1 class="font-display text-2xl font-bold text-fore">Welcome back</h1>
        <p class="mt-1 text-sm text-muted">Sign in to manage your portfolio</p>
      </div>
  
      <!-- Angular: <form (ngSubmit)="submit()"> + [(ngModel)] -->
      <form class="space-y-4">
        <div>
          <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-muted-2">Email</label>
          <input type="email" name="email" value="admin@portfolio.dev" required class="w-full rounded border border-navy-600 bg-navy-800 px-3.5 py-2.5 text-sm text-fore placeholder-muted transition-colors focus:border-teal focus:outline-none" />
        </div>
        <div>
          <label class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-muted-2">Password</label>
          <input type="password" name="password" value="admin123" required class="w-full rounded border border-navy-600 bg-navy-800 px-3.5 py-2.5 text-sm text-fore placeholder-muted transition-colors focus:border-teal focus:outline-none" />
        </div>
  
        <!-- @if (error()) -->
        <p class="rounded border border-red-400/20 bg-red-400/10 px-3 py-2 text-xs text-red-400">Invalid credentials. Try admin@portfolio.dev / admin123</p>
  
        <button routerLink="/admin" type="submit" class="font-display mt-2 w-full rounded bg-teal py-2.5 text-sm font-semibold text-navy transition-colors hover:bg-teal-dark disabled:opacity-50">Sign In</button>
      </form>
  
      <div class="mt-6 rounded border border-navy-600 bg-navy-800 p-3">
        <p class="text-center text-xs text-muted">Demo credentials: <span class="font-mono text-muted-2">admin@portfolio.dev</span> / <span class="font-mono text-muted-2">admin123</span></p>
      </div>
      <a routerLink="/" class="mt-6 block w-full text-center text-xs text-muted transition-colors hover:text-muted-2">← Back to portfolio</a>
    </div>
  </div>
