<!-- control-sidebar.html
imports: [RouterLink, RouterLinkActive]
The checkbox MUST stay a sibling BEFORE the overlay so `peer-checked` works.
The hamburger <label for="sidebarToggle"> lives in the admin layout header. -->
<input #toggle type="checkbox" id="sidebarToggle" class="peer hidden" />

<!-- ───────── Desktop sidebar ───────── -->
<aside class="sticky top-0 hidden h-screen w-64 shrink-0 flex-col overflow-y-auto border-r border-navy-600 bg-navy-800 md:flex">
<div class="flex items-center gap-2 px-4 py-5">
<div class="grid size-8 place-items-center rounded-lg bg-teal text-xs font-bold text-navy-900">AC</div>
<span class="font-display text-sm font-semibold text-fore">Portfolio Admin</span>
</div>
<div class="mx-4 border-t border-navy-600"></div>

<nav class="flex grow flex-col gap-1 px-2 py-3">
<a routerLink="dashboard" routerLinkActive="bg-teal/10! text-teal!"

<!-- ───────── Mobile overlay (opens when #sidebarToggle is checked) ───────── -->

<label for="sidebarToggle" class="absolute inset-0 cursor-pointer bg-black/60"></label>
<aside class="relative z-10 flex h-full w-64 flex-col overflow-y-auto border-r border-navy-600 bg-navy-800">

<div class="mx-4 border-t border-navy-600"></div>

<nav class="flex grow flex-col gap-1 px-2 py-3">
 <a routerLink="dashboard" routerLinkActive="bg-teal/10! text-teal!" (click)="toggle.checked = false"

 <a routerLink="projects" routerLinkActive="bg-teal/10! text-teal!" (click)="toggle.checked = false"

 <a routerLink="skills" routerLinkActive="bg-teal/10! text-teal!" (click)="toggle.checked = false"
    class="rounded-lg px-3 py-2 text-sm text-muted transition-colors hover:bg-navy-600/50 hover:text-white">Skills</a>
 <a routerLink="article" routerLinkActive="bg-teal/10! text-teal!" (click)="toggle.checked = false"
    class="rounded-lg px-3 py-2 text-sm text-muted transition-colors hover:bg-navy-600/50 hover:text-white">Articles</a>
 <a routerLink="about" routerLinkActive="bg-teal/10! text-teal!" (click)="toggle.checked = false"

 <a routerLink="testimonials" routerLinkActive="bg-teal/10! text-teal!" (click)="toggle.checked = false"

 <a routerLink="messages" routerLinkActive="bg-teal/10! text-teal!" (click)="toggle.checked = false"

<div class="flex flex-col gap-1 px-2 py-3">
